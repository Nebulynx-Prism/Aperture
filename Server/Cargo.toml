[package]
name = "prism-aperture"
version = "0.1.0"
edition = "2021"
description = "Prism Aperture Server — High-performance VR desktop streamer"
license = "MIT"

[dependencies]
# Window/GUI
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# Windows APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_Display",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }

# Networking
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
prost = "0.13"
prost-types = "0.13"

# Encryption
aes-gcm = "0.10"
rand = "0.8"

# Compression
lz4_flex = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"
socket2 = "0.5"

# Network discovery
mdns-sd = "0.11"

# UPnP
igd-next = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# System tray
tray-icon = "0.19"

# Image handling
image = "0.25"

# Misc
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
directories = "5"

[[bin]]
name = "prism-aperture-server"
path = "src/main.rs"

[[bin]]
name = "prism-aperture-service"
path = "src/service.rs"

[[bin]]
name = "patch-axml"
path = "src/bin/patch_axml.rs"

